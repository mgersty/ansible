---
# ---------------------------------------------------------------------------
# Target hardware: AMD Ryzen AI Max ("Strix Halo"), Radeon 8060S iGPU, gfx1151.
# Same box as the (retired) vllm group -- see group_vars/vllm.yml for why we
# moved off vLLM.
#
# Backend: ROCm/HIP. The host is provisioned separately with ROCm userspace;
# this role checks for /dev/kfd and DRM render-node access and passes those
# devices to the container. Use an image explicitly built with the HIP backend.
# ---------------------------------------------------------------------------

# --- Image ------------------------------------------------------------------
llama_cpp_image_repo: "ghcr.io/ggml-org/llama.cpp"
# Override with the verified HIP-enabled llama.cpp image tag for this target.
llama_cpp_image_tag: "server-rocm"
# The old pinned digest was verified for the Vulkan image. Keep tag-based
# resolution until a ROCm/HIP image digest is independently verified.
llama_cpp_image_digest: ""
llama_cpp_image_pin_digest: false

llama_cpp_image_ref: >-
  {{ llama_cpp_image_repo ~ '@' ~ llama_cpp_image_digest
     if llama_cpp_image_pin_digest | bool
     else llama_cpp_image_repo ~ ':' ~ llama_cpp_image_tag }}

# --- Service mode -------------------------------------------------------------
# Two separate llama.cpp services, one per model (split from the 2026-11
# router mode that served both on one port):
#   llama-cpp  qwen3.8-27b  chat (OpenAI endpoints), :8000
#   kev-4b     Kev-4B       decision model, native POST /v1/systemone
#                           (TypeSafe System 1), :8003
# Each service is its own container and systemd unit; both use the same
# ROCm/HIP image, the same GPU and the shared {{ llama_cpp_home }}.
# /v1/systemone landed in llama.cpp build b11361 (PR ggml-org/llama.cpp#29818);
# decision models are identified by GGUF metadata ({arch}.decision.type), so the
# chat model alone cannot answer them -- a decision model must be served too.
# Oldest llama.cpp build with /v1/systemone; the image task pulls a refresh if
# the local image predates it. The server-rocm tag is rolling, so a fresh pull
# is enough -- no tag change needed.
llama_cpp_min_build: 11361

# --- Host paths and service identity ----------------------------------------
# llama-cpp service (chat model; keeps the original name and port).
llama_cpp_container_name: llama-cpp
llama_cpp_service_name: llama-cpp
# kev-4b service (decision model; second container on its own port).
llama_cpp_kev_service_name: kev-4b
llama_cpp_kev_container_name: kev-4b
llama_cpp_home: /opt/llama-cpp
llama_cpp_models_dir: "{{ llama_cpp_home }}/models"
# Weights live in a per-model subdirectory (directory name = served id). Each
# service mounts {{ llama_cpp_models_dir }} at /models and names its own files
# explicitly; unrelated GGUFs in the models dir (retired quants, the
# thinkingcap/ subdirectory) are simply not mounted as --model.
llama_cpp_served_dir: "{{ llama_cpp_models_dir }}/served"
llama_cpp_container_models_dir: /models
llama_cpp_container_model_dir: "{{ llama_cpp_container_models_dir }}/served/{{ llama_cpp_served_model_name }}"
llama_cpp_kev_container_model_dir: "{{ llama_cpp_container_models_dir }}/served/{{ llama_cpp_decision_model_name }}"

# --- Docker ------------------------------------------------------------------
# Shared with the vllm role. If both roles run on the same fresh host, either
# can install Docker first; the apt tasks are idempotent.
llama_cpp_install_docker: true
docker_apt_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
docker_group_users:
  - matthew

# --- Host-side GPU access ----------------------------------------------------
# /dev/kfd is normally owned by render; render nodes may use render or video.
# Add the service operator to both groups on the host and pass their numeric
# GIDs to Docker. Existing sessions need a new login for group changes.
llama_cpp_device_groups:
  - render
  - video
# Adjust if this GPU uses a different DRM minor than renderD128.
llama_cpp_render_node: /dev/dri/renderD128
llama_cpp_device_group_users:
  - matthew

# --- Model --------------------------------------------------------------------
# unsloth/Qwen3.8-27B-GGUF, UD-Q8_K_XL (Unsloth "Dynamic" quant), with the
# separate Q4_0 MTP draft head. Per
# https://unsloth.ai/docs/models/qwen3.8#run-qwen3.8-in-llama.cpp -- that
# guide's build-from-source instructions are for a bare CUDA box; we use the
# equivalent official Docker image instead, consistent with how this repo runs
# vLLM, and because the host is meant to carry Docker and nothing else. The
# unsloth guide's model choice and download URLs are what we follow here; its
# llama.cpp build/install steps are not applicable to this host.
#
# The IQ1_XXXS / "iq1-narrow" fork mentioned in that guide is only needed for
# the 2.4T-A95B variant's most extreme quant -- not used here. IQ2_S/IQ2_XXS
# (one step below the target quality) are also that guide's territory for the
# 2.4T MoE model, not this 27B dense one -- MoE models tend to tolerate
# aggressive quantization much better than dense ones, so the lower quants are
# materially riskier than the target.
#
# This workload is memory-bandwidth-bound on gfx1151 (confirmed on hal --
# forcing --flash-attn on and quantizing the KV cache to q8_0 made no
# measurable difference to decode speed under UD-Q4_K_XL, which only makes
# sense if the bottleneck is re-reading the weights every token, not
# attention/KV-cache traffic). That means fewer bits per weight is the lever
# that actually helps here. Head-to-head on hal, identical prompts, same
# flags otherwise:
#
#   UD-Q4_K_XL   16.35 GiB   ~12.0 tok/s decode (without MTP)
#   UD-Q3_K_XL   13.15 GiB   ~14.8 tok/s decode
#   UD-Q2_K_XL    9.15 GiB   ~18.7 tok/s decode
#
# MTP is enabled through llama.cpp's native draft-mtp path. Keep the draft
# head at Q4_0 to limit its additional memory use; the server verifies the
# proposed tokens against the UD-Q8_K_XL target model.
#
# The Q8 target is about 31.46 GB on disk; no Q8+MTP benchmark has been
# recorded yet. Generation is expected to be more memory-bandwidth-bound than
# the smaller quants, so measure after deployment. The configuration uses
# --ctx-size 262144, with model load time dependent on storage speed.
# --ctx-size 262144, model load ~5s (no torch.compile/CUDA-graph warmup step
# the way vLLM has -- llama.cpp starts serving almost immediately).
llama_cpp_model_repo: "unsloth/Qwen3.8-27B-GGUF"
# Weights live in a per-model subdirectory (directory name = served id); the
# unit names the files inside it explicitly. Top-level files in the models dir
# (retired flat quants, the thinkingcap/ subdirectory) are not mounted.
llama_cpp_model_file: "Qwen3.8-27B-UD-Q8_K_XL.gguf"
llama_cpp_model_url: "https://huggingface.co/{{ llama_cpp_model_repo }}/resolve/main/{{ llama_cpp_model_file }}"
llama_cpp_model_draft_file: "mtp-Qwen3.8-27B-Q4_0.gguf"
llama_cpp_model_draft_url: "https://huggingface.co/{{ llama_cpp_model_repo }}/resolve/main/MTP/{{ llama_cpp_model_draft_file }}"
llama_cpp_spec_draft_n_max: 3
# Vision projector (mmproj) -- enables image input. Without it, llama-server
# rejects image content with a 500 error.
llama_cpp_model_mmproj_file: "mmproj-F16.gguf"
llama_cpp_model_mmproj_url: "https://huggingface.co/{{ llama_cpp_model_repo }}/resolve/main/{{ llama_cpp_model_mmproj_file }}"
# Served model id (OpenAI `model` field). Kept aligned with the vLLM-era name
# so client configs (Pi, curl examples) only need the port/backend to change.
# The host model directory is created under this exact name.
llama_cpp_served_model_name: "qwen3.8-27b"
llama_cpp_model_dir: "{{ llama_cpp_served_dir }}/{{ llama_cpp_served_model_name }}"

# --- Decision model (served by the kev-4b service for POST /v1/systemone) -----
# ggml-org's official decision-model GGUFs (see
# https://huggingface.co/blog/ggml-org/decision-models-in-llamacpp):
#   Julia-1  144M  mmBERT-small,  50+ langs, Apache-2.0
#   Laya     421M  ModernBERT-large, English, Apache-2.0
#   Kev-4B    4B   Qwen3.5-4B-Base, English, Apache-2.0  <- default
#   lev       4B   Qwen3.5-4B, English, Apache-2.0
#   OpenJev  27B   Qwen3.8-27B + vision, CC BY-NC (non-commercial!)
#   Clef     27B   Qwen3.8-27B + vision, Apache-2.0
# Kev-4B is the default: it is the article's quick-start model, the strongest
# Apache-2.0 option in the 4B class (the base Laya GGUF is the "english"
# checkpoint this repo already retired from laya.cpp for near-floor S1MB
# scores), and 3 GB on disk. Swap by changing repo/file/name below and
# re-running the playbook -- the served id follows the subdirectory name.
llama_cpp_decision_model_repo: "ggml-org/Kev-4B-GGUF"
llama_cpp_decision_model_file: "Kev-4B-Q4_K_M.gguf"
llama_cpp_decision_model_url: "https://huggingface.co/{{ llama_cpp_decision_model_repo }}/resolve/main/{{ llama_cpp_decision_model_file }}"
llama_cpp_decision_model_name: "kev-4b"
llama_cpp_decision_model_dir: "{{ llama_cpp_served_dir }}/{{ llama_cpp_decision_model_name }}"
# Decision prompts are short; 8k keeps KV small (same rationale as knowline).
llama_cpp_decision_ctx_size: 8192
# Native context is 262144 (extendable to 1M via YaRN; not enabled here).
llama_cpp_ctx_size: 262144
llama_cpp_gpu_layers: "all"
llama_cpp_flash_attn: "auto"
# deepseek: puts the model's <think>...</think> output in
# message.reasoning_content instead of leaving it inline in message.content.
llama_cpp_reasoning_format: "deepseek"

# --- Server -------------------------------------------------------------------
# One port per service. :8001 is laya.cpp, :8002 knowline, :8010 thinkingcap.
llama_cpp_bind_host: "0.0.0.0"
llama_cpp_port: 8000
llama_cpp_kev_port: 8003
# If set, clients must send `Authorization: Bearer <key>`. Empty = open on LAN
# (same posture as the vllm role). Applied to both services.
llama_cpp_api_key: ""

# Appended verbatim to each llama-server command line, after the flags the
# templates always set. One list entry per token.
llama_cpp_extra_args:
  - "--metrics"   # prometheus endpoint (present on the hal unit since 2026-11; kept here so the repo matches the deployment)

# --- Preflight ------------------------------------------------------------
# Image is tiny compared to vLLM's; the model weights dominate.
llama_cpp_image_disk_gb: 2
# Target (31.46 GB) + MTP draft head (1.37 GB) + mmproj (0.885 GB), rounded up.
llama_cpp_model_disk_gb: 36
# Kev-4B-Q4_K_M is 3.03 GB.
llama_cpp_decision_model_disk_gb: 4
llama_cpp_disk_headroom_gb: 10

# Open the API port with ufw, if ufw is installed and active. Same caveat as
# the vllm role: Docker's own iptables rules bypass ufw for published ports.
llama_cpp_manage_firewall: true
llama_cpp_firewall_source: "10.1.1.0/24"
