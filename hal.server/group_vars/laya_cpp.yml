---

laya_cpp_repo: "https://github.com/lkarlslund/laya.cpp.git"
laya_cpp_version: "main"

laya_cpp_user: matthew
laya_cpp_group: matthew
laya_cpp_home: /opt/laya-cpp

laya_cpp_checkout: "{{ laya_cpp_home }}/src"
laya_cpp_build_dir: "{{ laya_cpp_checkout }}/build-vulkan"
# The selected variant's checkpoint lives directly in laya.cpp's model root.
# Retired 2026-11-04: the `english` checkpoint (convaiinnovations/laya @
# 55cf4c4e) was replaced by `typed-decisions` below -- on S1MB's own
# laya--typed-decisions-* tasks the english variant scores near floor
# (choice 0.020 / noul 0.007 / score 0.004, Task Avg 13.4 overall, rank
# 181/228), while typed-decisions does choice 0.287 / noul 0.444 / score
# 0.635 on the same tasks. Same ModernBERT-large encoder architecture, so no
# build changes; only the checkpoint download and --variant flag differ.
laya_cpp_model_dir: "{{ laya_cpp_home }}/models/laya"
laya_cpp_checkpoint_dir: "{{ laya_cpp_model_dir }}"
laya_cpp_model_repo: "convaiinnovations/laya-typed-decisions"
laya_cpp_model_revision: "e929ae5cf69bc34259cd2f95c9e91145b818b1f0"

laya_cpp_build_jobs: 16
laya_cpp_force_build: false

laya_cpp_service_name: laya-cpp
laya_cpp_executable: "{{ laya_cpp_build_dir }}/bin/laya-cli"

laya_cpp_bind_host: 0.0.0.0
laya_cpp_port: 8001

laya_cpp_health_path: /health
laya_cpp_health_status: 200
laya_cpp_verify_endpoint: true

laya_cpp_variant: typed-decisions
laya_cpp_model_path: "{{ laya_cpp_model_dir }}"

laya_cpp_server_args:
  - --server
  - --port
  - "{{ laya_cpp_port }}"
  - --model
  - "{{ laya_cpp_model_path }}"
  - --variant
  - "{{ laya_cpp_variant }}"
  - --vulkan
laya_cpp_environment: {}

# Native checkpoint files for the general English Laya model.
laya_cpp_models:
  - file: model.safetensors
  - file: rl_agent_config.json
  - file: encoder/config.json
  - file: tokenizer/tokenizer.json
  - file: tokenizer/tokenizer_config.json



