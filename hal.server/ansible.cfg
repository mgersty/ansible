[defaults]
inventory = inventory.yml
host_key_checking = False
# The old `stdout_callback = yaml` was community.general.yaml, removed in
# community.general 12.0.0. This is the ansible-core replacement.
stdout_callback = default
callback_result_format = yaml
interpreter_python = auto_silent
retry_files_enabled = False
# Model downloads and ~10 GB of ROCm wheels make some tasks very long-running.
timeout = 60

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=15m -o PreferredAuthentications=publickey

[privilege_escalation]
become = True
become_method = sudo
# hal requires a sudo password, so prompt rather than fail deep into the run.
become_ask_pass = True
