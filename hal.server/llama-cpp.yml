---
# Run llama.cpp (ROCm/HIP backend) on hal (AMD Strix Halo / gfx1151) as two
# Docker containers managed by systemd -- one service per model:
#   llama-cpp  qwen3.8-27b chat model (OpenAI endpoints) on :8000
#   kev-4b     Kev-4B decision model (native POST /v1/systemone) on :8003
# The host supplies ROCm userspace and the kernel exposes /dev/kfd plus the
# DRM render node(s).
#
#   ansible-playbook llama-cpp.yml -K

- name: Deploy llama.cpp chat + decision services on gfx1151 (ROCm/HIP)
  hosts: llama_cpp
  become: true
  gather_facts: true

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Restart llama-cpp
      ansible.builtin.systemd_service:
        name: "{{ llama_cpp_service_name }}"
        state: restarted

    - name: Restart kev-4b
      ansible.builtin.systemd_service:
        name: "{{ llama_cpp_kev_service_name }}"
        state: restarted

  tasks:
    # -----------------------------------------------------------------------
    - name: Preflight
      tags: [preflight]
      block:
        - name: Verify ROCm device nodes exist
          ansible.builtin.stat:
            path: "{{ item }}"
          loop:
            - /dev/kfd
            - "{{ llama_cpp_render_node }}"
          register: rocm_device_nodes

        - name: Fail if ROCm device nodes are missing
          ansible.builtin.assert:
            that: rocm_device_nodes.results | map(attribute='stat.exists') | min
            fail_msg: >-
              ROCm requires /dev/kfd and {{ llama_cpp_render_node }}. Verify
              the amdgpu driver and host ROCm setup.

        - name: Check free disk space
          ansible.builtin.set_fact:
            llama_cpp_free_gb: >-
              {{ (ansible_facts['mounts']
                  | selectattr('mount', 'equalto', '/')
                  | map(attribute='size_available')
                  | first / 1073741824) | round(1) }}

        - name: Check whether the image is already pulled
          ansible.builtin.command: "docker image inspect {{ llama_cpp_image_ref }}"
          register: preflight_image
          changed_when: false
          failed_when: false

        - name: Check whether the chat model is already downloaded
          ansible.builtin.stat:
            path: "{{ llama_cpp_model_dir }}/{{ llama_cpp_model_file }}"
          register: preflight_target_weights

        - name: Check whether the MTP draft head is already downloaded
          ansible.builtin.stat:
            path: "{{ llama_cpp_model_dir }}/{{ llama_cpp_model_draft_file }}"
          register: preflight_draft_weights

        - name: Check whether the vision mmproj file is already downloaded
          ansible.builtin.stat:
            path: "{{ llama_cpp_model_dir }}/{{ llama_cpp_model_mmproj_file }}"
          register: preflight_mmproj_weights

        - name: Check whether the decision model is already downloaded
          ansible.builtin.stat:
            path: "{{ llama_cpp_decision_model_dir }}/{{ llama_cpp_decision_model_file }}"
          register: preflight_decision_weights

        - name: Compute the space still required
          ansible.builtin.set_fact:
            llama_cpp_required_gb: >-
              {{ ((llama_cpp_image_disk_gb if preflight_image.rc | default(1) != 0 else 0)
                  + (llama_cpp_model_disk_gb
                     if (not preflight_target_weights.stat.exists
                         or not preflight_draft_weights.stat.exists
                         or not preflight_mmproj_weights.stat.exists) else 0)
                  + ((llama_cpp_decision_model_disk_gb | default(0))
                     if (not preflight_decision_weights.stat.exists) else 0)
                  + llama_cpp_disk_headroom_gb) | float }}

        - name: Fail if the disk cannot hold what is still missing
          ansible.builtin.assert:
            that: llama_cpp_free_gb | float >= llama_cpp_required_gb | float
            fail_msg: >-
              Only {{ llama_cpp_free_gb }} GB free on / but {{ llama_cpp_required_gb }} GB
              is still required
              ({{ 'image ' ~ llama_cpp_image_disk_gb ~ ' GB' if preflight_image.rc | default(1) != 0 else 'image already pulled' }};
              {{ 'chat model + MTP + mmproj weights ' ~ llama_cpp_model_disk_gb ~ ' GB'
                 if (not preflight_target_weights.stat.exists
                     or not preflight_draft_weights.stat.exists
                     or not preflight_mmproj_weights.stat.exists)
                 else 'chat model + MTP + mmproj weights already present' }};
              {{ 'decision model ' ~ llama_cpp_decision_model_disk_gb ~ ' GB'
                 if (not preflight_decision_weights.stat.exists)
                 else 'decision model already present' }};
              headroom {{ llama_cpp_disk_headroom_gb }} GB).
              sudo lvextend -l +100%FREE /dev/ubuntu-vg/ubuntu-lv && sudo resize2fs /dev/ubuntu-vg/ubuntu-lv
            success_msg: >-
              {{ llama_cpp_free_gb }} GB free, {{ llama_cpp_required_gb }} GB still required.

    # -----------------------------------------------------------------------
    - name: Install Docker
      tags: [docker]
      when: llama_cpp_install_docker | bool
      block:
        - name: Install apt prerequisites
          ansible.builtin.apt:
            name:
              - ca-certificates
              - curl
              - gnupg
              - python3-debian
            state: present
            update_cache: true
            cache_valid_time: 3600

        - name: Create the apt keyring directory
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Install the Docker apt key
          ansible.builtin.get_url:
            url: https://download.docker.com/linux/ubuntu/gpg
            dest: /etc/apt/keyrings/docker.asc
            owner: root
            group: root
            mode: "0644"

        - name: Add the Docker apt repository
          ansible.builtin.deb822_repository:
            name: docker
            types: [deb]
            uris: "https://download.docker.com/linux/ubuntu"
            suites: ["{{ ansible_facts['distribution_release'] }}"]
            components: [stable]
            architectures: >-
              {{ ['amd64'] if ansible_facts['architecture'] == 'x86_64'
                 else [ansible_facts['architecture']] }}
            signed_by: /etc/apt/keyrings/docker.asc
            enabled: true
            state: present

        - name: Install Docker Engine
          ansible.builtin.apt:
            name: "{{ docker_apt_packages }}"
            state: present
            update_cache: true

        - name: Enable and start Docker
          ansible.builtin.systemd_service:
            name: docker
            enabled: true
            state: started

        - name: Add users to the docker group
          ansible.builtin.user:
            name: "{{ item }}"
            groups: docker
            append: true
          loop: "{{ docker_group_users }}"

    # -----------------------------------------------------------------------
    - name: Resolve the ROCm device group IDs
      tags: [preflight, service, verify]
      block:
        # Docker --group-add needs numeric GIDs, not host group names. Read
        # them from the actual device ownership to match this machine's udev.
        - name: Stat ROCm device nodes for group IDs
          ansible.builtin.stat:
            path: "{{ item }}"
          loop:
            - /dev/kfd
            - "{{ llama_cpp_render_node }}"
          register: llama_cpp_rocm_device_nodes

        - name: Record ROCm device GIDs
          ansible.builtin.set_fact:
            llama_cpp_device_gids: >-
              {{ [llama_cpp_rocm_device_nodes.results[0].stat.gid,
                  llama_cpp_rocm_device_nodes.results[1].stat.gid] | unique }}

        - name: Grant users host-side access to the GPU device
          ansible.builtin.user:
            name: "{{ item }}"
            groups: "{{ llama_cpp_device_groups | join(',') }}"
            append: true
          loop: "{{ llama_cpp_device_group_users }}"
          register: gpu_groups

        - name: Note that group changes need a new login
          ansible.builtin.debug:
            msg: >-
              Added {{ gpu_groups.results | selectattr('changed') | map(attribute='item') | join(', ') }}
              to {{ llama_cpp_device_groups | join(', ') }}. Log out and back in for it to take effect.
          when: gpu_groups.results | selectattr('changed') | list | length > 0

    # -----------------------------------------------------------------------
    - name: Create host directories
      tags: [dirs]
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: matthew
        group: matthew
        mode: "0755"
      loop:
        - "{{ llama_cpp_home }}"
        - "{{ llama_cpp_models_dir }}"
        - "{{ llama_cpp_model_dir }}"
        - "{{ llama_cpp_decision_model_dir }}"

    # -----------------------------------------------------------------------
    - name: Pull the llama.cpp image
      tags: [image]
      block:
        - name: Check whether the image is already present
          ansible.builtin.command: "docker image inspect {{ llama_cpp_image_ref }}"
          register: image_present
          changed_when: false
          failed_when: false

        - name: Pull {{ llama_cpp_image_ref }}
          ansible.builtin.command: "docker pull {{ llama_cpp_image_ref }}"
          when: image_present.rc != 0
          changed_when: true
          timeout: 600
          notify:
            - Restart llama-cpp
            - Restart kev-4b

        # /v1/systemone (decision models) landed in build b{{ llama_cpp_min_build }}
        # (ggml-org/llama.cpp#29818). The server-rocm tag is rolling: if the
        # image already on the host predates that build, pull the refresh --
        # the kev-4b service needs it for POST /v1/systemone.
        - name: Report the build of the local image
          ansible.builtin.command: >-
            docker run --rm --entrypoint /app/llama-server
            {{ llama_cpp_image_ref }} --version
          register: image_version
          changed_when: false
          failed_when: false

        - name: Record the local image build number
          # --version prints to stderr, like all of llama-server's logs.
          # Use [0-9] (not \d) and no backreferences: the regex runs through two
          # escape layers (YAML -> Jinja) and backslash forms mangle silently.
          ansible.builtin.set_fact:
            llama_cpp_image_build: >-
              {{ (image_version.stderr | default('') | regex_search('build [0-9]+') | default('')).split()[-1]
                 if (image_version.rc | default(1) == 0
                     and (image_version.stderr | default('')) is search('build [0-9]+')) else 0 }}

        - name: Pull a refresh if the local image predates /v1/systemone
          ansible.builtin.command: "docker pull {{ llama_cpp_image_ref }}"
          when: llama_cpp_image_build | int < llama_cpp_min_build | int
          changed_when: true
          timeout: 600
          notify:
            - Restart llama-cpp
            - Restart kev-4b

    # -----------------------------------------------------------------------
    - name: Verify the container can reach the GPU
      tags: [image, verify]
      ansible.builtin.command: >-
        docker run --rm --device /dev/kfd --device {{ llama_cpp_render_node }}
        {{ llama_cpp_device_gids | map('regex_replace', '^', '--group-add ') | join(' ') }}
        --entrypoint /app/llama-server {{ llama_cpp_image_ref }}
        --list-devices
      register: gpu_check
      changed_when: false

    - name: Report the detected device
      tags: [image, verify]
      ansible.builtin.debug:
        msg: "container sees: {{ gpu_check.stdout_lines }}"

    - name: Fail if no ROCm device was found
      tags: [image, verify]
      ansible.builtin.assert:
        that:
          - "'(none)' not in gpu_check.stdout"
          - "gpu_check.stdout | lower is search('rocm|hip')"
        fail_msg: >-
          llama-server --list-devices did not report a ROCm/HIP device. Check
          that this is a HIP-enabled image, and that /dev/kfd and
          {{ llama_cpp_render_node }} are exposed.

    # -----------------------------------------------------------------------
    - name: Lay out and download model weights
      tags: [model]
      # A plain HTTPS GET, not huggingface_hub -- these are public files, not
      # a repo snapshot, so there is no need for a Python environment on the
      # host or inside a throwaway container.
      block:
        # One-time migration (2026-11): the served weights moved from flat
        # files in {{ llama_cpp_models_dir }}/ into the per-model subdirectory
        # layout. mv is instant (same filesystem); the retired flat quants
        # (Q2/Q3/Q4) and thinkingcap/ stay put, outside the served/ directory.
        - name: Stat the old and new locations of the chat model files
          ansible.builtin.stat:
            path: "{{ item }}"
          loop:
            - "{{ llama_cpp_models_dir }}/{{ llama_cpp_model_file }}"
            - "{{ llama_cpp_model_dir }}/{{ llama_cpp_model_file }}"
            - "{{ llama_cpp_models_dir }}/{{ llama_cpp_model_draft_file }}"
            - "{{ llama_cpp_model_dir }}/{{ llama_cpp_model_draft_file }}"
            - "{{ llama_cpp_models_dir }}/{{ llama_cpp_model_mmproj_file }}"
            - "{{ llama_cpp_model_dir }}/{{ llama_cpp_model_mmproj_file }}"
          register: model_file_locs

        - name: Move each legacy flat file into the served/ layout
          ansible.builtin.command: >-
            mv {{ model_file_locs.results[2 * item.n].item }}
               {{ model_file_locs.results[2 * item.n + 1].item }}
          loop:
            - { n: 0, what: "{{ llama_cpp_model_file }}" }
            - { n: 1, what: "{{ llama_cpp_model_draft_file }}" }
            - { n: 2, what: "{{ llama_cpp_model_mmproj_file }}" }
          loop_control:
            label: "{{ item.what }}"
          when:
            - model_file_locs.results[2 * item.n].stat.exists
            - not model_file_locs.results[2 * item.n + 1].stat.exists
          changed_when: true
          notify: Restart llama-cpp

        - name: Download the chat model weights
          ansible.builtin.get_url:
            url: "{{ item.url }}"
            dest: "{{ llama_cpp_model_dir }}/{{ item.file }}"
            owner: matthew
            group: matthew
            mode: "0644"
            timeout: 3600
          loop:
            - url: "{{ llama_cpp_model_url }}"
              file: "{{ llama_cpp_model_file }}"
            - url: "{{ llama_cpp_model_draft_url }}"
              file: "{{ llama_cpp_model_draft_file }}"
            - url: "{{ llama_cpp_model_mmproj_url }}"
              file: "{{ llama_cpp_model_mmproj_file }}"
          register: model_download
          notify: Restart llama-cpp

        - name: Download the decision model
          ansible.builtin.get_url:
            url: "{{ llama_cpp_decision_model_url }}"
            dest: "{{ llama_cpp_decision_model_dir }}/{{ llama_cpp_decision_model_file }}"
            owner: matthew
            group: matthew
            mode: "0644"
            timeout: 3600
          register: decision_download
          notify: Restart kev-4b

    # -----------------------------------------------------------------------
    - name: Configure the systemd services
      tags: [service]
      block:
        - name: Write the llama-cpp (chat) unit file
          ansible.builtin.template:
            src: llama-cpp.service.j2
            dest: "/etc/systemd/system/{{ llama_cpp_service_name }}.service"
            owner: root
            group: root
            mode: "0644"
          notify:
            - Reload systemd
            - Restart llama-cpp

        - name: Write the kev-4b (decision) unit file
          ansible.builtin.template:
            src: kev-4b.service.j2
            dest: "/etc/systemd/system/{{ llama_cpp_kev_service_name }}.service"
            owner: root
            group: root
            mode: "0644"
          notify:
            - Reload systemd
            - Restart kev-4b

        - name: Remove the retired router-mode presets file
          # The 2026-11 router mode read /opt/llama-cpp/presets.ini; the two
          # per-model units do not. Inert once the units above are re-rendered,
          # so no handler is needed here.
          ansible.builtin.file:
            path: "{{ llama_cpp_home }}/presets.ini"
            state: absent

        - name: Flush handlers so the services start with current config
          ansible.builtin.meta: flush_handlers

        - name: Enable and start llama-cpp
          ansible.builtin.systemd_service:
            name: "{{ llama_cpp_service_name }}"
            enabled: true
            state: started
            daemon_reload: true

        - name: Enable and start kev-4b
          ansible.builtin.systemd_service:
            name: "{{ llama_cpp_kev_service_name }}"
            enabled: true
            state: started
            daemon_reload: true

    # -----------------------------------------------------------------------
    - name: Open the API ports
      tags: [firewall]
      when: llama_cpp_manage_firewall | bool
      block:
        - name: Check whether ufw is present
          ansible.builtin.command: ufw status
          register: ufw_status
          changed_when: false
          failed_when: false

        - name: Allow the service ports from the local network
          community.general.ufw:
            rule: allow
            port: "{{ item.port }}"
            proto: tcp
            src: "{{ llama_cpp_firewall_source }}"
            comment: "{{ item.comment }}"
          loop:
            - { port: "{{ llama_cpp_port }}", comment: "llama.cpp API" }
            - { port: "{{ llama_cpp_kev_port }}", comment: "kev-4b decision API" }
          when: ufw_status.rc == 0 and 'inactive' not in ufw_status.stdout

    # -----------------------------------------------------------------------
    - name: Wait for the APIs to become healthy
      tags: [verify]
      block:
        - name: Poll the llama-cpp (chat) health endpoint
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ llama_cpp_port }}/health"
            status_code: 200
          register: chat_health
          until: chat_health.status == 200
          retries: 30
          delay: 5

        - name: Poll the kev-4b (decision) health endpoint
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ llama_cpp_kev_port }}/health"
            status_code: 200
          register: decision_health
          until: decision_health.status == 200
          retries: 30
          delay: 5

        - name: List the models served by each service
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ item.port }}/v1/models"
            headers: "{{ {'Authorization': 'Bearer ' + llama_cpp_api_key} if llama_cpp_api_key | length > 0 else {} }}"
            return_content: true
          loop:
            - { port: "{{ llama_cpp_port }}", id: "{{ llama_cpp_served_model_name }}" }
            - { port: "{{ llama_cpp_kev_port }}", id: "{{ llama_cpp_decision_model_name }}" }
          register: models
          until: >-
            models.results | map(attribute='status') | select('equalto', 200) | list | length
            == models.results | length
          retries: 60
          delay: 5

        - name: Assert each service advertises its model
          ansible.builtin.assert:
            that:
              - llama_cpp_served_model_name in models.results[0].json.data | map(attribute='id')
              - llama_cpp_decision_model_name in models.results[1].json.data | map(attribute='id')
            fail_msg: >-
              Served models:
              llama-cpp: {{ models.results[0].json.data | default([]) | map(attribute='id') | join(', ') }}
              kev-4b: {{ models.results[1].json.data | default([]) | map(attribute='id') | join(', ') }}

        - name: Probe /v1/systemone on the kev-4b service
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ llama_cpp_kev_port }}/v1/systemone"
            method: POST
            body_format: json
            body:
              model: "{{ llama_cpp_decision_model_name }}"
              state: "Customer message: I was charged twice for my order last week and nobody has replied."
              questions:
                route:
                  type: choice
                  instructions: "Which team should handle this?"
                  criteria:
                    billing: ~
                    shipping: ~
                    technical: ~
            headers: "{{ {'Authorization': 'Bearer ' + llama_cpp_api_key} if llama_cpp_api_key | length > 0 else {} }}"
            status_code: 200
            return_content: true
            timeout: 120
          register: systemone
          retries: 3
          delay: 5

        - name: Assert the decision endpoint answered
          ansible.builtin.assert:
            that:
              - systemone.status == 200
              - "'route' in systemone.json.answers"
              - systemone.json.answers.route.type == 'choice'
              - systemone.json.answers.route.choice in ['billing', 'shipping', 'technical']
            fail_msg: >-
              /v1/systemone did not return a typed answer: {{ systemone.json }}

        - name: Report the endpoints
          ansible.builtin.debug:
            msg:
              - "llama-cpp is serving: {{ models.results[0].json.data | map(attribute='id') | join(', ') }} (http://{{ ansible_host }}:{{ llama_cpp_port }}/v1)"
              - "kev-4b is serving: {{ models.results[1].json.data | map(attribute='id') | join(', ') }} (http://{{ ansible_host }}:{{ llama_cpp_kev_port }}/v1)"
              - >-
                Decision model: POST /v1/systemone with "model":
                "{{ llama_cpp_decision_model_name }}" (answered probe:
                {{ systemone.json.answers.route.choice }})
